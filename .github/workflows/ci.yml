name: CI

# Every push to main and every pull request runs the tests, and builds and
# checks what `make release-arch` (on x86_64 and aarch64) and `make
# release-common` make. A branch without a pull request isn't tested: open
# one, even as a draft.
# A push to main also refreshes the "nightly" release with them, and a v* tag
# (see scripts/release.sh) makes a release of its own, only if every job
# passes. Their files are attested (signed as built by this workflow), and
# their notes are their part of the changelog (scripts/changelog.sh).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only: the jobs that publish ask for more
permissions:
  contents: read

# A new push to a pull request cancels the run that's testing the code it
# replaces. Pushes to main and tags never cancel anything.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DEPS: liblua5.4-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev

jobs:
  test:
    # Memory errors, leaks and undefined behavior in one run, data races in
    # the other (ThreadSanitizer can't be combined with AddressSanitizer)
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        sanitize: ["address,undefined", thread]
    name: test (${{ matrix.cc }}, ${{ matrix.sanitize }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # git describe needs the tags, for the version
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y $DEPS
          sudo apt-get install -y zsh fish # test/completions.sh tries the completions in them

      # The runners randomize addresses more than the sanitizers can handle
      # ("FATAL: ThreadSanitizer: unexpected memory mapping")
      - name: Make the sanitizers work
        run: sudo sysctl vm.mmap_rnd_bits=28

      # WERROR=1: a new warning fails CI, not only shows up in its log
      - name: Build
        run: make CC=${{ matrix.cc }} WERROR=1

      - name: Test
        run: make test CC=${{ matrix.cc }} SANITIZE=${{ matrix.sanitize }} WERROR=1

  # The default build and the packages use X11 and both, so this is the other
  # BACKEND (the make test matrix builds and tests x11)
  backends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y $DEPS

      - name: Build for Wayland only
        run: make BACKEND=wayland WERROR=1

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The version in the Makefile: others may format differently. pipx:
      # the system's Python takes no pip installs (PEP 668)
      - name: Install clang-format
        run: pipx install "clang-format==$(sed -n 's/^CLANG_FORMAT_VERSION := //p' Makefile)"

      - name: Check the format
        run: make check-format

      # Whatever scripts there are, and the shell tests: the init script
      # deletes itself, and the others depend on the parts it kept
      - name: Check the scripts
        run: find scripts test -type f \( -path 'scripts/*' -o -name '*.sh' \) -exec shellcheck {} +

  # The paths no test runs: clang's static analyzer (see `make analyze`)
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y $DEPS

      - name: Analyze
        run: make analyze

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: 0.15.1 # a new one could change the PDFs, or break them

      - name: Build PDFs
        run: make docs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs/**/*.pdf
          if-no-files-found: ignore

  package:
    # The oldest runners: an AppImage needs a glibc at least as new as the one
    # it was built with, so this makes it run on more systems
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            make: release-arch release-common
          - runner: ubuntu-22.04-arm
            arch: aarch64
            make: release-arch
    name: package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y $DEPS

      # What the Makefile downloads (raylib and the release tools), checked
      # before every use whether they come from here or from the download
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools/downloads
          key: downloads-${{ matrix.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: downloads-${{ matrix.arch }}-

      - name: Build
        run: make BACKEND=both ${{ matrix.make }} WERROR=1

      # What gets released works, before it's released
      - name: Check the release files
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # the runners have no FUSE
        run: |
          shopt -s nullglob
          version=$(make -s version)
          for bin in ./*.AppImage; do
            [[ $("$bin" --version) == *" $version" ]]
            "$bin" --config config.lua
          done
          for man in ./*.1; do
            grep -q "$version" "$man"
          done
          for completions in ./*-completions.tar.gz; do
            tar -tvzf "$completions"
            [ "$(tar -tzf "$completions" | grep -c '[^/]$')" = 3 ]
          done
          # The source tarball builds on its own, and knows its version
          for src in ./*-"$version".tar.gz; do
            tar -xzf "$src" -C "$RUNNER_TEMP"
            dir=$RUNNER_TEMP/$(basename "$src" .tar.gz)
            make -C "$dir"
            name=$(basename "$src" "-$version.tar.gz")
            echo "built from $src: $("$dir/$name" --version)"
            [[ $("$dir/$name" --version) == "$name $version" ]]
          done

      # The tarballs are reproducible (see TAR in the Makefile): built again
      # from scratch, elsewhere, later and as if checked out with another
      # umask, they're the same bytes
      - name: The tarballs are reproducible
        if: contains(matrix.make, 'release-common')
        run: |
          again=$RUNNER_TEMP/again
          cp -a . "$again"
          rm -rf "$again/build" "$again"/*.tar.gz
          chmod -R go-rwx "$again"
          sleep 1
          make -C "$again" release-common
          for tarball in ./*.tar.gz; do
            cmp "$tarball" "$again/$tarball"
            echo "$tarball: the same"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.AppImage
            *.1
          if-no-files-found: ignore

  # scripts/install.sh on what package made, served as a release from a dir:
  # a broken install.sh fails here, before it's published
  install-check:
    needs: package
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      REPO: ${{ github.repository }}
      APPIMAGE_EXTRACT_AND_RUN: 1 # the runners have no FUSE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # make version needs the tags
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/github/${{ github.repository }}/releases/download/ci
          merge-multiple: true

      # Like the release job makes it, but for what install.sh doesn't use.
      # GITHUB is where install.sh looks for releases.
      - name: Make the release
        run: |
          echo "GITHUB=file://$RUNNER_TEMP/github" >>"$GITHUB_ENV"
          cd "$RUNNER_TEMP/github/$REPO/releases/download/ci"
          cp "$GITHUB_WORKSPACE/scripts/install.sh" .
          sha256sum -- * >SHA256SUMS
          ls -l

      # No attestation: nothing's published yet
      - name: Install, reinstall, uninstall
        run: scripts/test-install.sh ci --skip-attestation

      - name: Install as root, to /usr/local
        run: |
          name=$(sed -n 's/^NAME := //p' Makefile)
          sudo --preserve-env=GITHUB,REPO bash scripts/install.sh --yes --skip-attestation ci
          test -x "/usr/local/bin/$name"
          sudo --preserve-env=GITHUB,REPO bash scripts/install.sh --yes uninstall
          test ! -e "/usr/local/bin/$name"

  # One check that passes only if every other one did, for main's ruleset to
  # require (scripts/github-setup.sh), and for the release to wait for:
  # requiring each job by name would break whenever they change
  ok:
    if: ${{ !cancelled() }}
    needs:
      - test
      - backends
      - format
      - analyze
      - docs
      - package
      - install-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ]; done

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: ok
    # One at a time: nightly's files are replaced in place
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release, and the nightly tag
      id-token: write # for the attestation
      attestations: write
    steps:
      # Its credentials stay: it pushes the nightly tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Changelog
        run: |
          scripts/changelog.sh >release/CHANGELOG.md
          # The release's notes are its own section, without its title line
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/changelog.sh "$GITHUB_REF_NAME" | tail -n +3 >notes.md
          else
            changes=$(scripts/changelog.sh HEAD | tail -n +3)
            {
              echo "Built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC'). It changes with every push to main."
              echo
              echo "${changes:-No changes since the last release.}"
            } >notes.md
          fi

      - name: Checksums
        run: |
          # PDFs from docs/ subfolders keep their folders: flatten them
          find release -mindepth 2 -type f -exec mv -t release {} +
          find release -mindepth 1 -type d -delete
          # The install script too, so it's attested like the rest: what the
          # README runs is releases/latest/download/install.sh
          cp scripts/install.sh release/
          cd release && sha256sum -- * >SHA256SUMS

      # Proof that these files were built here, from this commit: `gh
      # attestation verify` checks SHA256SUMS, and SHA256SUMS the rest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
            exit
          fi
          # The tag moves here, and the release's files are replaced in place:
          # deleting it and making it again would leave a moment without it.
          # SHA256SUMS goes last, so a download in between finds files newer
          # than their checksums, and fails instead of using them.
          version=$(git describe --tags --match 'v*' --always)
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create nightly release/* --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
              --title "Nightly $version" --notes-file notes.md
            exit
          fi
          cd release
          files=()
          for file in *; do [ "$file" = SHA256SUMS ] || files+=("$file"); done
          gh release upload nightly "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload nightly SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          # The files this build doesn't have, like the last one's source tarball
          gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
            while read -r asset; do
              [ -e "$asset" ] || gh release delete-asset nightly "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
          # Its date stays the first one's: the notes say when this was built
          gh release edit nightly --repo "$GITHUB_REPOSITORY" --title "Nightly $version" --notes-file ../notes.md

  install:
    # scripts/install.sh again, on the release just published, as users run
    # it: from GitHub, checking its attestation
    needs: release
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # for gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # --strict: no attestation fails
      - name: Install, reinstall, uninstall
        env:
          GH_TOKEN: ${{ github.token }} # gh attestation verify needs a login
          REPO: ${{ github.repository }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && tag=$GITHUB_REF_NAME || tag=nightly
          scripts/test-install.sh "$tag" --strict

      - name: The release's install.sh is this one, and attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && tag=$GITHUB_REF_NAME || tag=nightly
          curl -fsSL -o "$RUNNER_TEMP/install.sh" "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/install.sh"
          cmp "$RUNNER_TEMP/install.sh" scripts/install.sh
          gh attestation verify "$RUNNER_TEMP/install.sh" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"

      - name: Install as root, to /usr/local
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && tag=$GITHUB_REF_NAME || tag=nightly
          name=$(sed -n 's/^NAME := //p' Makefile)
          sudo --preserve-env=GH_TOKEN,REPO bash scripts/install.sh --yes --strict "$tag"
          test -x "/usr/local/bin/$name"
          sudo --preserve-env=REPO bash scripts/install.sh --yes uninstall
          test ! -e "/usr/local/bin/$name"
